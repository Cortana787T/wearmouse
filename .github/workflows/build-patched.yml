name: Build patched WearMouse

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WearMouse
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch styles.xml
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/res/values/styles.xml")
          text = path.read_text()

          if "Theme.WearMouse.Input" not in text:
              patch = """
              <style name="Theme.WearMouse.Input"
                  parent="@style/Theme.Wearable.Modal">
                  <item name="android:windowSwipeToDismiss">false</item>
              </style>
              """

              text = text.replace(
                  "</resources>",
                  patch + "\n</resources>"
              )

              path.write_text(text)

          print("styles.xml patched successfully.")

      - name: Patch AndroidManifest.xml
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          text = path.read_text()

          activity_name = 'android:name=".ui.input.InputActivity"'

          start = text.find("<activity", text.find(activity_name))

          if start == -1:
              raise RuntimeError("InputActivity was not found.")

          end = text.find("/>", start)

          if end == -1:
              raise RuntimeError(
                  "Could not find the end of the InputActivity element."
              )

          end += 2

          block = text[start:end]

          print("Original InputActivity:")
          print(block)

          # Replace the existing theme.
          old_theme = 'android:theme="@style/Theme.Wearable.Modal"'
          new_theme = 'android:theme="@style/Theme.WearMouse.Input"'

          if old_theme in block:
              block = block.replace(old_theme, new_theme)
          elif new_theme not in block:
              # If there isn't a theme attribute, add one.
              block = block.replace(
                  "/>",
                  f'\n            {new_theme}\n            />'
              )

          text = text[:start] + block + text[end:]

          path.write_text(text)

          print()
          print("Patched InputActivity:")
          print(block)

      - name: Verify patch
        run: |
          echo "===== Theme ====="
          grep -A4 "Theme.WearMouse.Input" \
            app/src/main/res/values/styles.xml

          echo
          echo "===== InputActivity ====="
          grep -A8 'InputActivity' \
            app/src/main/AndroidManifest.xml

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build WearMouse
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WearMouse-patched
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
