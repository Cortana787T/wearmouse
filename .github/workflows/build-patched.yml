name: Build patched WearMouse

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch styles.xml
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/main/res/values/styles.xml")
          s = p.read_text()

          if "Theme.WearMouse.Input" not in s:
              s = s.replace(
                  "</resources>",
                  """    <style name="Theme.WearMouse.Input"
              parent="@style/Theme.Wearable.Modal">
              <item name="android:windowSwipeToDismiss">false</item>
          </style>
          </resources>"""
              )

          p.write_text(s)

      - name: Patch InputActivity
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # Find the InputActivity element.
          pattern = (
              r'(<activity\b[^>]*'
              r'android:name="\Q.ui.input.InputActivity\E"[^>]*/>)'
          )

          # Python does not support \Q, so use the literal version.
          pattern = (
              r'(<activity\b[^>]*'
              r'android:name="\.\ui\.input\.InputActivity"[^>]*/>)'
          )

          match = re.search(pattern, s, re.DOTALL)

          if not match:
              raise RuntimeError(
                  "Could not find InputActivity in AndroidManifest.xml"
              )

          block = match.group(1)

          # Replace the existing theme.
          block = re.sub(
              r'android:theme="[^"]*"',
              'android:theme="@style/Theme.WearMouse.Input"',
              block
          )

          s = s[:match.start(1)] + block + s[match.end(1):]

          p.write_text(s)

      - name: Verify patch
        run: |
          echo "===== InputActivity ====="
          grep -A6 'InputActivity' app/src/main/AndroidManifest.xml

          echo
          echo "===== Patched theme ====="
          grep -A4 'Theme.WearMouse.Input' \
            app/src/main/res/values/styles.xml

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build WearMouse
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WearMouse-patched
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
