name: Build patched WearMouse

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WearMouse
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Add a theme that disables the Wear OS swipe-back gesture
      - name: Patch WearMouse theme
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/res/values/styles.xml")
          s = p.read_text()

          if "Theme.WearMouse.Input" not in s:
              s = s.replace(
                  "</resources>",
                  """    <style name="Theme.WearMouse.Input"
                      parent="@style/Theme.Wearable.Modal">
                      <item name="android:windowSwipeToDismiss">false</item>
                  </style>

              </resources>"""
              )

          p.write_text(s)
          PY

      # Make InputActivity use the patched theme
      - name: Patch InputActivity
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          old = 'android:theme="@style/Theme.Wearable.Modal"'
          new = 'android:theme="@style/Theme.WearMouse.Input"'

          if old not in s:
              raise SystemExit(
                  "Could not find the InputActivity theme. "
                  "The WearMouse source may have changed."
              )

          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      # Build the APK
      - name: Build WearMouse
        run: ./gradlew assembleDebug --stacktrace

      # Show exactly what APK was produced
      - name: Find APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      # Make the APK available from the GitHub Actions run
      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: WearMouse-patched
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
