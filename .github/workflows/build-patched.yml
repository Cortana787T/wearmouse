name: Build patched WearMouse

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch WearMouse
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ----- styles.xml -----

          styles = Path("app/src/main/res/values/styles.xml")
          text = styles.read_text()

          if "Theme.WearMouse.Input" not in text:
              text = text.replace(
                  "</resources>",
                  """    <style name="Theme.WearMouse.Input"
              parent="@style/Theme.Wearable.Modal">
              <item name="android:windowSwipeToDismiss">false</item>
          </style>
          </resources>"""
              )

              styles.write_text(text)

          # ----- AndroidManifest.xml -----

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          marker = 'android:name=".ui.input.InputActivity"'

          marker_pos = text.find(marker)

          if marker_pos == -1:
              raise Exception("InputActivity not found")

          activity_start = text.rfind("<activity", 0, marker_pos)
          activity_end = text.find("/>", marker_pos)

          if activity_start == -1 or activity_end == -1:
              raise Exception("Could not locate InputActivity element")

          activity_end += 2

          activity = text[activity_start:activity_end]

          activity = activity.replace(
              'android:theme="@style/Theme.Wearable.Modal"',
              'android:theme="@style/Theme.WearMouse.Input"'
          )

          text = (
              text[:activity_start]
              + activity
              + text[activity_end:]
          )

          manifest.write_text(text)

          print("PATCH COMPLETE")
          print()
          print(activity)

      - name: Verify patch
        run: |
          echo "=== Manifest ==="
          grep -A6 'InputActivity' app/src/main/AndroidManifest.xml

          echo
          echo "=== Theme ==="
          grep -A4 'Theme.WearMouse.Input' \
            app/src/main/res/values/styles.xml

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WearMouse-patched
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
